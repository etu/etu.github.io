---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    reviewers:
      - etu

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    reviewers:
      - etu
    commit-message:
      prefix: 'chore(flake)'
    groups:
      flake-inputs:
        patterns:
          - '*'
